<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic &amp; Engineering Progress Tracker</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            zinc: {
              950: '#09090b',
              900: '#121215',
              850: '#18181b',
              800: '#27272a',
              750: '#323238',
              700: '#3f3f46',
              600: '#52525b',
              500: '#71717a',
              400: '#a1a1aa',
              300: '#d4d4d8',
              200: '#e4e4e7',
              100: '#f4f4f5',
            }
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #09090b;
    }

    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }

    /* Date input custom styling */
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8) brightness(1.2);
      cursor: pointer;
    }

    /* Smooth animations */
    .fade-enter {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Range slider accent */
    input[type="range"] {
      accent-color: #10b981;
    }
  </style>
</head>

<body
  class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-emerald-500/30 selection:text-emerald-200">

  <!-- ========================================================================= -->
  <!-- TOP APP HEADER & NAVIGATION -->
  <!-- ========================================================================= -->
  <header class="sticky top-0 z-40 bg-zinc-950/85 backdrop-blur-md border-b border-zinc-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">

      <!-- Brand & Status -->
      <div class="flex items-center gap-3">
        <div
          class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-zinc-950 shadow-md shadow-emerald-500/20 font-bold">
          <i data-lucide="graduation-cap" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-sm sm:text-base font-bold text-zinc-100 tracking-tight leading-none">
              Academic Tracker
            </h1>
            <span
              class="hidden md:inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-mono font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
              Local DB
            </span>
          </div>
          <p class="text-[11px] text-zinc-400 leading-none mt-1 hidden sm:block">
            Engineering, College &amp; Startup Cadence
          </p>
        </div>
      </div>

      <!-- Center: Date Controls -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="btn-prev-day" title="Previous Day"
          class="p-1.5 sm:p-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-zinc-100 hover:border-zinc-700 transition active:scale-95">
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>

        <div class="relative flex items-center">
          <input type="date" id="date-picker-input"
            class="px-2.5 sm:px-3 py-1.5 text-xs sm:text-sm font-mono font-medium bg-zinc-900 border border-zinc-800 rounded-xl text-zinc-100 focus:outline-none focus:border-emerald-500/80 transition" />
        </div>

        <button id="btn-next-day" title="Next Day"
          class="p-1.5 sm:p-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-zinc-100 hover:border-zinc-700 transition active:scale-95">
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>

        <button id="btn-today"
          class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20 transition active:scale-95">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          Today
        </button>
      </div>

      <!-- Right: Screen Nav Tabs & Quick Add -->
      <div class="flex items-center gap-2">
        <!-- Desktop Nav Buttons -->
        <nav
          class="hidden lg:flex items-center gap-1 bg-zinc-900/90 p-1 rounded-xl border border-zinc-800 text-xs font-semibold">
          <button data-nav="today"
            class="nav-tab-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-zinc-400 hover:text-zinc-100 transition">
            <i data-lucide="calendar" class="w-3.5 h-3.5"></i> Today
          </button>
          <button data-nav="weekly"
            class="nav-tab-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-zinc-400 hover:text-zinc-100 transition">
            <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i> Weekly
          </button>
          <button data-nav="monthly"
            class="nav-tab-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-zinc-400 hover:text-zinc-100 transition">
            <i data-lucide="bar-chart-3" class="w-3.5 h-3.5"></i> Monthly Analytics
          </button>
          <button data-nav="settings"
            class="nav-tab-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-zinc-400 hover:text-zinc-100 transition">
            <i data-lucide="settings" class="w-3.5 h-3.5"></i> Backup &amp; Config
          </button>
        </nav>

        <!-- Quick Add Button -->
        <button id="btn-open-quick-add"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-zinc-950 text-xs font-bold transition shadow-sm shadow-emerald-500/20 active:scale-95">
          <i data-lucide="plus" class="w-4 h-4 stroke-[2.5]"></i>
          <span class="hidden sm:inline">Quick Add</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- MAIN VIEWPORT CONTAINER -->
  <!-- ========================================================================= -->
  <main id="app-viewport" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
    <!-- Screen contents dynamically injected here -->
  </main>

  <!-- ========================================================================= -->
  <!-- MOBILE BOTTOM NAVIGATION -->
  <!-- ========================================================================= -->
  <nav
    class="lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-zinc-950/95 backdrop-blur-md border-t border-zinc-800/80 px-2 py-2 flex items-center justify-around text-[10px] font-semibold text-zinc-400">
    <button data-nav="today" class="mobile-nav-btn flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition">
      <i data-lucide="calendar" class="w-4 h-4"></i>
      <span>Today</span>
    </button>
    <button data-nav="weekly" class="mobile-nav-btn flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition">
      <i data-lucide="layout-grid" class="w-4 h-4"></i>
      <span>Weekly</span>
    </button>
    <button data-nav="monthly" class="mobile-nav-btn flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition">
      <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
      <span>Analytics</span>
    </button>
    <button data-nav="settings" class="mobile-nav-btn flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition">
      <i data-lucide="settings" class="w-4 h-4"></i>
      <span>Settings</span>
    </button>
  </nav>

  <!-- ========================================================================= -->
  <!-- QUICK ADD MODAL -->
  <!-- ========================================================================= -->
  <div id="quick-add-modal"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-zinc-950/80 backdrop-blur-sm hidden">
    <div class="w-full max-w-md bg-zinc-900 border border-zinc-700/80 rounded-2xl p-5 shadow-2xl space-y-4 fade-enter">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
        <div class="flex items-center gap-2">
          <div class="p-1.5 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
          </div>
          <h3 class="font-bold text-zinc-100 text-sm">Quick Add Item</h3>
        </div>
        <button id="btn-close-quick-add"
          class="p-1.5 rounded-lg text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800 transition">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Quick Add Category Selector -->
      <div class="grid grid-cols-3 gap-2 text-xs font-semibold">
        <button id="qa-tab-academic"
          class="qa-type-btn py-2 px-2.5 rounded-xl border bg-emerald-500/15 border-emerald-500/40 text-emerald-300 flex items-center justify-center gap-1.5">
          <i data-lucide="book-open" class="w-3.5 h-3.5"></i> Academic
        </button>
        <button id="qa-tab-startup"
          class="qa-type-btn py-2 px-2.5 rounded-xl border bg-zinc-950 border-zinc-800 text-zinc-400 hover:text-zinc-200 flex items-center justify-center gap-1.5">
          <i data-lucide="rocket" class="w-3.5 h-3.5"></i> Startup
        </button>
        <button id="qa-tab-lecture"
          class="qa-type-btn py-2 px-2.5 rounded-xl border bg-zinc-950 border-zinc-800 text-zinc-400 hover:text-zinc-200 flex items-center justify-center gap-1.5">
          <i data-lucide="graduation-cap" class="w-3.5 h-3.5"></i> Lecture
        </button>
      </div>

      <!-- Form Inputs -->
      <form id="quick-add-form" class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-zinc-400 block mb-1">Title / Name</label>
          <input type="text" id="qa-input-title" placeholder="e.g. Solve 2 Graph questions or Review compiler notes"
            required
            class="w-full px-3 py-2 text-sm rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-emerald-500 transition" />
        </div>

        <div id="qa-task-extras" class="grid grid-cols-2 gap-3 text-xs">
          <div>
            <label class="font-semibold text-zinc-400 block mb-1">Priority</label>
            <select id="qa-select-priority"
              class="w-full px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-100 focus:outline-none focus:border-emerald-500">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div>
            <label class="font-semibold text-zinc-400 block mb-1">Est. Time</label>
            <input type="text" id="qa-input-estimate" placeholder="45m" value="45m"
              class="w-full px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-100 focus:outline-none focus:border-emerald-500" />
          </div>
        </div>

        <div id="qa-lecture-extras" class="grid grid-cols-2 gap-3 text-xs hidden">
          <div>
            <label class="font-semibold text-zinc-400 block mb-1">Time Slot</label>
            <input type="text" id="qa-input-slot" placeholder="09:00 - 10:00 AM" value="10:00 - 11:00 AM"
              class="w-full px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-100 focus:outline-none focus:border-emerald-500" />
          </div>
          <div>
            <label class="font-semibold text-zinc-400 block mb-1">Topic</label>
            <input type="text" id="qa-input-topic" placeholder="e.g. Distributed Consensus"
              class="w-full px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-100 focus:outline-none focus:border-emerald-500" />
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="btn-cancel-quick-add"
            class="px-4 py-2 text-xs font-semibold rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 transition">
            Cancel
          </button>
          <button type="submit"
            class="px-4 py-2 text-xs font-bold rounded-xl bg-emerald-500 hover:bg-emerald-600 text-zinc-950 shadow-md shadow-emerald-500/20 transition">
            Add to Today
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Hidden File Input for JSON Backup Import -->
  <input type="file" id="file-import-input" accept=".json,application/json" class="hidden" />

  <!-- ========================================================================= -->
  <!-- TOAST NOTIFICATION CONTAINER -->
  <!-- ========================================================================= -->
  <div id="toast-container" class="fixed bottom-16 lg:bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none">
  </div>

  <!-- ========================================================================= -->
  <!-- JAVASCRIPT APPLICATION LOGIC -->
  <!-- ========================================================================= -->
  <script>
    /**
     * Academic & Engineering Progress Tracker
     * Standalone Single-File Application
     * Storage key: 'academic_tracker_db'
     */

    const STORAGE_KEY = 'academic_tracker_db';

    // Application state
    const state = {
      activeScreen: 'today', // 'today' | 'weekly' | 'monthly' | 'settings'
      currentDate: getTodayISO(),
      todaySubTab: 'routine', // 'routine' | 'pillars'
      monthView: {
        year: new Date().getFullYear(),
        month: new Date().getMonth(), // 0-indexed
      },
      qaType: 'academic',
      db: null,
      showMonthlyAnalyticsCollapsible: false,
    };

    // =========================================================================
    // UTILITIES
    // =========================================================================
    function getTodayISO() {
      const now = new Date();
      return formatISO(now);
    }

    function formatISO(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function parseISODate(isoStr) {
      if (!isoStr) return new Date();
      const [y, m, d] = isoStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDisplayDate(isoStr) {
      const d = parseISODate(isoStr);
      return d.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function getDayOfWeek(isoStr) {
      const d = parseISODate(isoStr);
      return d.getDay(); // 0 = Sun, 1 = Mon, ..., 6 = Sat
    }

    function generateId(prefix = 'id') {
      return `${prefix}-${Date.now()}-${Math.random().toString(36).substring(2, 7)}`;
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');

      const icon = type === 'success'
        ? '<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>'
        : '<i data-lucide="info" class="w-4 h-4 text-sky-400"></i>';

      toast.className = 'pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl bg-zinc-900/95 border border-zinc-750 text-zinc-100 text-xs shadow-xl shadow-black/40 fade-enter';
      toast.innerHTML = `
        ${icon}
        <span class="font-medium">${message}</span>
      `;

      container.appendChild(toast);
      if (window.lucide) lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    // =========================================================================
    // TEMPLATE GENERATOR & SEED DATA
    // =========================================================================
    function generateTemplateBlocks(dateStr, saturdayCollegeMode = false) {
      const dayOfWeek = getDayOfWeek(dateStr);

      // Weekday (Mon–Fri: days 1–5) OR Saturday with College Mode active (day 6 && saturdayCollegeMode)
      if ((dayOfWeek >= 1 && dayOfWeek <= 5) || (dayOfWeek === 6 && saturdayCollegeMode)) {
        return [
          {
            id: `block-${dateStr}-gym`,
            key: 'gym',
            title: 'Gym',
            timeSlot: '07:00 - 08:00',
            category: 'gym',
            hasTextarea: false,
            completed: false,
            notes: '',
          },
          {
            id: `block-${dateStr}-college`,
            key: 'college',
            title: 'College Lectures',
            timeSlot: '09:00 - 17:00',
            category: 'college',
            hasTextarea: false,
            completed: false,
            notes: '',
            totalLectures: 6,
            lecturesAttended: 0,
            lectureStatus: [false, false, false, false, false, false],
          },
          {
            id: `block-${dateStr}-rest`,
            key: 'rest',
            title: 'Rest & Reset',
            timeSlot: '17:00 - 18:00',
            category: 'rest',
            hasTextarea: false,
            completed: false,
            notes: '',
          },
          {
            id: `block-${dateStr}-academic`,
            key: 'academic',
            title: 'Academic Work',
            timeSlot: '18:00 - 20:00',
            category: 'academic',
            hasTextarea: true,
            textareaPlaceholder: 'Topics, assignments, notes...',
            completed: false,
            notes: '',
          },
          {
            id: `block-${dateStr}-dinner`,
            key: 'dinner',
            title: 'Dinner & Chill',
            timeSlot: '20:00 - 22:00',
            category: 'dinner',
            hasTextarea: false,
            completed: false,
            notes: '',
          },
          {
            id: `block-${dateStr}-startup`,
            key: 'startup',
            title: 'Startup Sprint',
            timeSlot: '22:00 - 23:30',
            category: 'startup',
            hasTextarea: true,
            textareaPlaceholder: 'Tasks done, features shipped, notes...',
            completed: false,
            notes: '',
          },
        ];
      }

      // Saturday (When Regular College Today is OFF - Default)
      if (dayOfWeek === 6 && !saturdayCollegeMode) {
        return [
          {
            id: `block-${dateStr}-gym`,
            key: 'gym',
            title: 'Gym',
            timeSlot: '07:00 - 08:00',
            category: 'gym',
            hasTextarea: false,
            completed: false,
            notes: '',
          },
          {
            id: `block-${dateStr}-rev1`,
            key: 'rev1',
            title: 'Revision Block 1',
            timeSlot: '10:00 - 12:00',
            category: 'revision',
            hasTextarea: true,
            textareaPlaceholder: 'Topics, problem sets, notes...',
            completed: false,
            notes: '',
          },
          {
            id: `block-${dateStr}-rev2`,
            key: 'rev2',
            title: 'Revision Block 2',
            timeSlot: '14:00 - 16:00',
            category: 'revision',
            hasTextarea: true,
            textareaPlaceholder: 'Topics, problem sets, notes...',
            completed: false,
            notes: '',
          },
          {
            id: `block-${dateStr}-startup`,
            key: 'startup',
            title: 'Startup Sprint',
            timeSlot: '18:00 - 20:00',
            category: 'startup',
            hasTextarea: true,
            textareaPlaceholder: 'Tasks done, deliverables, roadmap...',
            completed: false,
            notes: '',
          },
        ];
      }

      // Sunday (Recovery & Deep Revision - No Gym block)
      return [
        {
          id: `block-${dateStr}-rev1`,
          key: 'rev1',
          title: 'Revision Block 1',
          timeSlot: '10:00 - 12:00',
          category: 'revision',
          hasTextarea: true,
          textareaPlaceholder: 'Topics, problem sets, notes...',
          completed: false,
          notes: '',
        },
        {
          id: `block-${dateStr}-rev2`,
          key: 'rev2',
          title: 'Revision Block 2',
          timeSlot: '14:00 - 16:00',
          category: 'revision',
          hasTextarea: true,
          textareaPlaceholder: 'Topics, problem sets, notes...',
          completed: false,
          notes: '',
        },
        {
          id: `block-${dateStr}-startup`,
          key: 'startup',
          title: 'Startup Sprint',
          timeSlot: '18:00 - 20:00',
          category: 'startup',
          hasTextarea: true,
          textareaPlaceholder: 'Tasks done, weekly roadmap, review...',
          completed: false,
          notes: '',
        },
      ];
    }

    function getBlockKey(id, category) {
      if (!id) return category || 'unknown';
      if (id.includes('-gym')) return 'gym';
      if (id.includes('-college')) return 'college';
      if (id.includes('-rest')) return 'rest';
      if (id.includes('-academic')) return 'academic';
      if (id.includes('-dinner')) return 'dinner';
      if (id.includes('-startup')) return 'startup';
      if (id.includes('-rev1')) return 'rev1';
      if (id.includes('-rev2')) return 'rev2';
      return category || id;
    }

    function syncRoutineBlocks(log) {
      const isSatCollege = !!log.saturday_college_mode;
      const expectedBlocks = generateTemplateBlocks(log.date, isSatCollege);

      if (!Array.isArray(log.schedule_blocks) || log.schedule_blocks.length === 0) {
        log.schedule_blocks = expectedBlocks;
        return;
      }

      const currentKeys = log.schedule_blocks.map(b => b.key || getBlockKey(b.id, b.category));
      const expectedKeys = expectedBlocks.map(b => b.key);

      const isMatch = currentKeys.length === expectedKeys.length &&
        currentKeys.every((k, i) => k === expectedKeys[i]);

      if (isMatch) {
        log.schedule_blocks = log.schedule_blocks.map((b, idx) => {
          const exp = expectedBlocks[idx];
          return {
            ...exp,
            completed: !!b.completed,
            notes: b.notes || '',
            lectureStatus: b.lectureStatus || exp.lectureStatus,
            lecturesAttended: (b.lecturesAttended !== undefined) ? b.lecturesAttended : (b.lectureStatus ? b.lectureStatus.filter(Boolean).length : exp.lecturesAttended),
          };
        });
        return;
      }

      // Preserve previously saved states across template switches
      const prevMap = {};
      log.schedule_blocks.forEach(b => {
        const k = b.key || getBlockKey(b.id, b.category);
        prevMap[k] = b;
        if (b.category) prevMap[b.category] = b;
      });

      log.schedule_blocks = expectedBlocks.map(exp => {
        const prev = prevMap[exp.key] || prevMap[exp.category];
        if (prev) {
          return {
            ...exp,
            completed: !!prev.completed,
            notes: prev.notes || '',
            lectureStatus: prev.lectureStatus || exp.lectureStatus,
            lecturesAttended: (prev.lecturesAttended !== undefined) ? prev.lecturesAttended : (prev.lectureStatus ? prev.lectureStatus.filter(Boolean).length : exp.lecturesAttended),
          };
        }
        return exp;
      });
    }

    function createBlankLog(dateStr) {
      const isWeekend = getDayOfWeek(dateStr) === 0 || getDayOfWeek(dateStr) === 6;

    // =========================================================================
    // STORAGE ENGINE
    // =========================================================================
    function loadDatabase() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.dailyLogs && parsed.settings) {
            return parsed;
          }
        }
      } catch (err) {
        console.error('Failed to parse database from localStorage:', err);
      }

      // Fallback initialization
      const seed = generateSeedDatabase();
      saveDatabase(seed);
      return seed;
    }

    function saveDatabase(dbInstance = state.db) {
      if (!dbInstance) return;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(dbInstance));
      } catch (err) {
        console.error('Failed to save database to localStorage:', err);
        showToast('Storage quota exceeded or error saving!', 'error');
      }
    }

    function getOrInitLog(dateStr) {
      if (!state.db.dailyLogs[dateStr]) {
        state.db.dailyLogs[dateStr] = createBlankLog(dateStr);
        saveDatabase();
      }
      const log = state.db.dailyLogs[dateStr];
      if (log.sleep_hours === undefined || log.sleep_hours === null) {
        log.sleep_hours = 7.0;
      }
      syncRoutineBlocks(log);
      return log;
    }

    // =========================================================================
    // SCORING ENGINE
    // =========================================================================
    function calculateDailyScore(log) {
      if (!log) return { score: 0, completedTasks: 0, totalTasks: 0 };
      let points = 0;
      let maxPoints = 0;

      // 1. Schedule blocks execution (40% weight)
      const blocks = log.schedule_blocks || [];
      if (blocks.length > 0) {
        const comp = blocks.filter(b => b.completed).length;
        points += (comp / blocks.length) * 40;
      } else {
        points += 20;
      }
      maxPoints += 40;

      // 2. Checklist tasks execution (30% weight)
      const tasks = [...(log.academic_tasks || []), ...(log.startup_tasks || [])];
      const totalTasks = tasks.length;
      const completedTasks = tasks.filter(t => t.completed).length;
      if (totalTasks > 0) {
        points += (completedTasks / totalTasks) * 30;
      } else {
        points += 30;
      }
      maxPoints += 30;

      // 3. Habit vitals & Deep work (30% weight)
      let habitPoints = 0;
      if (log.workout_completed) habitPoints += 10;
      if ((log.study_hours || 0) >= (state.db.settings.targetStudyHours || 4)) habitPoints += 7;
      else if ((log.study_hours || 0) > 0) habitPoints += 4;
      if ((log.startup_hours || 0) >= (state.db.settings.targetStartupHours || 3)) habitPoints += 7;
      else if ((log.startup_hours || 0) > 0) habitPoints += 4;
      if ((log.dsa_solved || 0) >= (state.db.settings.targetDsaCount || 2)) habitPoints += 6;
      else if ((log.dsa_solved || 0) > 0) habitPoints += 3;
      points += habitPoints;
      maxPoints += 30;

      const score = Math.min(100, Math.round((points / maxPoints) * 100));
      return { score, completedTasks, totalTasks };
    }

    // =========================================================================
    // EXPORT & IMPORT BACKUP SYSTEM
    // =========================================================================
    function exportJSONBackup() {
      try {
        const dataStr = JSON.stringify(state.db, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);

        const nowStr = formatISO(new Date());
        const filename = `tracker-backup-${nowStr}.json`;

        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast(`Exported ${filename}`);
      } catch (err) {
        console.error('Export failed:', err);
        showToast('Export failed. Check console.', 'error');
      }
    }

    function handleImportFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (!imported || typeof imported !== 'object' || !imported.dailyLogs) {
            throw new Error('Invalid JSON tracker structure: missing dailyLogs.');
          }

          state.db = {
            version: imported.version || 1,
            exportedAt: imported.exportedAt || new Date().toISOString(),
            settings: {
              ...generateSeedDatabase().settings,
              ...(imported.settings || {}),
            },
            dailyLogs: imported.dailyLogs || {},
          };

          saveDatabase();
          renderApp();
          showToast(`Backup restored! ${Object.keys(state.db.dailyLogs).length} daily logs loaded.`);
        } catch (err) {
          console.error('Import error:', err);
          alert('Failed to import JSON file. Please ensure it is a valid Academic Tracker backup.');
        }
      };
      reader.readAsText(file);
    }

    // =========================================================================
    // RENDER: MONTHLY ANALYTICS ENGINE, METRICS & HEATMAP
    // =========================================================================
    function calculateMonthlyStats(year, month) {
      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = getTodayISO();

      let sleepSum = 0;
      let sleepCount = 0;
      let totalAcademicHours = 0;
      let startupSprintsCount = 0;
      let potentialLectures = 0;
      let attendedLectures = 0;
      let activeDaysCount = 0;
      const completionRates = {};

      for (let day = 1; day <= daysInMonth; day++) {
        const dStr = `${monthPrefix}-${String(day).padStart(2, '0')}`;
        const log = state.db.dailyLogs[dStr];
        const dayOfWeek = getDayOfWeek(dStr);
        const isCollegeDay = (dayOfWeek >= 1 && dayOfWeek <= 5) || (dayOfWeek === 6 && log?.saturday_college_mode);

        if (log) {
          // 1. Average Sleep Hours
          if (typeof log.sleep_hours === 'number' && log.sleep_hours > 0) {
            sleepSum += log.sleep_hours;
            sleepCount++;
          }

          // 2. Total Academic & Revision Hours logged
          let dayAcadHours = log.study_hours || 0;
          const blocks = log.schedule_blocks || [];
          const completedAcadBlocks = blocks.filter(b => (b.category === 'academic' || b.category === 'revision') && b.completed);
          if (dayAcadHours === 0 && completedAcadBlocks.length > 0) {
            dayAcadHours = completedAcadBlocks.length * 2;
          }
          totalAcademicHours += dayAcadHours;

          // 3. Startup sprints completed (count)
          const startupCompleted = blocks.some(b => b.category === 'startup' && b.completed);
          if (startupCompleted) {
            startupSprintsCount++;
          }

          // 4. Lecture attendance on college days
          if (isCollegeDay && (dStr <= todayStr || log.schedule_blocks?.length > 0)) {
            const collegeBlock = blocks.find(b => b.category === 'college');
            const lecAtt = collegeBlock ? (collegeBlock.lecturesAttended ?? (collegeBlock.lectureStatus ? collegeBlock.lectureStatus.filter(Boolean).length : 0)) : (log.lectures ? log.lectures.filter(l => l.attended).length : 0);
            const lecPot = collegeBlock ? (collegeBlock.totalLectures || 6) : 6;
            potentialLectures += lecPot;
            attendedLectures += lecAtt;
          }

          // Completion rate for heatmap
          if (blocks.length > 0) {
            const comp = blocks.filter(b => b.completed).length;
            const rate = Math.round((comp / blocks.length) * 100);
            completionRates[dStr] = rate;
            if (rate >= 25) activeDaysCount++;
          } else {
            completionRates[dStr] = 0;
          }
        } else {
          if (isCollegeDay && dStr <= todayStr) {
            potentialLectures += 6;
          }
          completionRates[dStr] = 0;
        }
      }

      const avgSleep = sleepCount > 0 ? (sleepSum / sleepCount).toFixed(1) : '7.0';
      const lectureAttendanceRate = potentialLectures > 0 ? Math.round((attendedLectures / potentialLectures) * 100) : 0;

      return {
        year,
        month,
        daysInMonth,
        monthPrefix,
        avgSleep,
        sleepCount,
        totalAcademicHours: Number(totalAcademicHours.toFixed(1)),
        startupSprintsCount,
        attendedLectures,
        potentialLectures,
        lectureAttendanceRate,
        activeDaysCount,
        completionRates,
      };
    }

    function renderHeatmapCalendarGrid(stats) {
      const { year, month, daysInMonth, monthPrefix, completionRates } = stats;
      const firstDayOfMonth = new Date(year, month, 1).getDay(); // 0 = Sun
      const startOffset = firstDayOfMonth === 0 ? 6 : firstDayOfMonth - 1; // Mon = 0
      const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

      let gridHtml = `
        <div class="grid grid-cols-7 gap-2 text-center text-xs text-zinc-500 font-semibold mb-1 select-none">
          ${dayNames.map(d => `<div>${d}</div>`).join('')}
        </div>
        <div class="grid grid-cols-7 gap-2">
      `;

      // Leading empty days
      for (let i = 0; i < startOffset; i++) {
        gridHtml += `<div class="h-16 sm:h-20 rounded-xl bg-zinc-950/40 border border-zinc-850/40 opacity-30"></div>`;
      }

      // Actual month days
      for (let day = 1; day <= daysInMonth; day++) {
        const dStr = `${monthPrefix}-${String(day).padStart(2, '0')}`;
        const log = state.db.dailyLogs[dStr];
        const isToday = dStr === getTodayISO();
        const isSelected = dStr === state.currentDate;
        const rate = completionRates[dStr] || 0;

        // Specified color tiers:
        // 0-25%: zinc-800
        // 25-50%: emerald-950
        // 50-75%: emerald-700
        // 75-100%: emerald-500
        let cellClass = 'bg-zinc-800 border-zinc-700/80 text-zinc-300';
        let rateColor = 'text-zinc-500';

        if (rate >= 75) {
          cellClass = 'bg-emerald-500 border-emerald-400 text-zinc-950 font-bold shadow-sm shadow-emerald-500/20';
          rateColor = 'text-zinc-950 font-extrabold';
        } else if (rate >= 50) {
          cellClass = 'bg-emerald-700 border-emerald-600 text-emerald-100 font-semibold';
          rateColor = 'text-emerald-200';
        } else if (rate >= 25) {
          cellClass = 'bg-emerald-950 border-emerald-900 text-emerald-300 font-medium';
          rateColor = 'text-emerald-400';
        } else {
          cellClass = 'bg-zinc-800 border-zinc-700/80 text-zinc-400';
          rateColor = 'text-zinc-500';
        }

        gridHtml += `
          <div
            onclick="selectDateAndOpen('${dStr}')"
            class="h-16 sm:h-20 p-2 sm:p-2.5 rounded-xl border ${cellClass} cursor-pointer transition-all hover:scale-[1.03] flex flex-col justify-between select-none ${isSelected ? 'ring-2 ring-emerald-400 ring-offset-2 ring-offset-zinc-950' : ''
          }"
            title="${dStr}: ${rate}% completed (Click to edit date)"
          >
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold">${day}</span>
              ${isToday ? '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" title="Today"></span>' : ''}
            </div>
            <div class="text-[11px] font-mono text-right ${rateColor}">
              ${rate > 0 ? `${rate}%` : log ? '0%' : '<span class="opacity-50">-</span>'}
            </div>
          </div>
        `;
      }

      gridHtml += `</div>`;
      return gridHtml;
    }

    // =========================================================================
    // EVENT HANDLERS & MUTATIONS
    // =========================================================================
    function setScreen(screenName) {
      state.activeScreen = screenName;
      renderApp();
    }

    function setTodaySubTab(subTab) {
      state.todaySubTab = subTab;
      renderApp();
    }

    function setDate(isoStr) {
      state.currentDate = isoStr;
      renderApp();
    }

    function shiftDay(delta) {
      const d = parseISODate(state.currentDate);
      d.setDate(d.getDate() + delta);
      state.currentDate = formatISO(d);
      renderApp();
    }

    function shiftWeek(days) {
      const d = parseISODate(state.currentDate);
      d.setDate(d.getDate() + days);
      state.currentDate = formatISO(d);
      renderApp();
    }

    function goToCurrentWeek() {
      state.currentDate = getTodayISO();
      renderApp();
    }

    function shiftMonth(delta) {
      let y = state.monthView.year;
      let m = state.monthView.month + delta;
      if (m > 11) {
        m = 0;
        y++;
      } else if (m < 0) {
        m = 11;
        y--;
      }
      state.monthView.year = y;
      state.monthView.month = m;
      renderApp();
    }

    function selectDateAndOpen(dateStr) {
      state.currentDate = dateStr;
      state.activeScreen = 'today';
      renderApp();
    }

    // Schedule Block mutations
    function toggleScheduleBlock(blockId) {
      const log = getOrInitLog(state.currentDate);
      const b = (log.schedule_blocks || []).find(x => x.id === blockId);
      if (b) {
        b.completed = !b.completed;
        if (b.category === 'college') {
          b.lectureStatus = [b.completed, b.completed, b.completed, b.completed, b.completed, b.completed];
          b.lecturesAttended = b.completed ? 6 : 0;
        }
        saveDatabase();
        renderApp();
      }
    }

    function toggleBlockLecture(blockId, lectureIdx) {
      const log = getOrInitLog(state.currentDate);
      const b = (log.schedule_blocks || []).find(x => x.id === blockId);
      if (b) {
        if (!b.lectureStatus) b.lectureStatus = [false, false, false, false, false, false];
        b.lectureStatus[lectureIdx] = !b.lectureStatus[lectureIdx];
        b.lecturesAttended = b.lectureStatus.filter(Boolean).length;
        b.completed = b.lecturesAttended === 6;
        saveDatabase();
        renderApp();
      }
    }

    function updateBlockNotes(blockId, notes) {
      const log = getOrInitLog(state.currentDate);
      const b = (log.schedule_blocks || []).find(x => x.id === blockId);
      if (b) {
        b.notes = notes;
        saveDatabase(); // Instant auto-save to localStorage
      }
    }

    function toggleSaturdayCollegeMode() {
      const log = getOrInitLog(state.currentDate);
      log.saturday_college_mode = !log.saturday_college_mode;
      syncRoutineBlocks(log);
      saveDatabase();
      renderApp();
      showToast(log.saturday_college_mode ? 'Regular College Today (9-5) enabled' : 'Switched to Weekend template');
    }

    // Sleep Mutations
    function setSleep(hours) {
      const log = getOrInitLog(state.currentDate);
      log.sleep_hours = Math.max(0, Math.min(16, Math.round(hours * 10) / 10));
      saveDatabase();
      renderApp();
    }

    function adjustSleep(delta) {
      const log = getOrInitLog(state.currentDate);
      const current = (log.sleep_hours !== undefined && log.sleep_hours !== null) ? log.sleep_hours : 7.0;
      setSleep(current + delta);
    }

    // Task Mutations
    function toggleTask(taskId, category) {
      const log = getOrInitLog(state.currentDate);
      const key = category === 'academic' ? 'academic_tasks' : 'startup_tasks';
      const t = (log[key] || []).find(x => x.id === taskId);
      if (t) {
        t.completed = !t.completed;
        saveDatabase();
        renderApp();
      }
    }

    function deleteTask(taskId, category) {
      const log = getOrInitLog(state.currentDate);
      const key = category === 'academic' ? 'academic_tasks' : 'startup_tasks';
      log[key] = (log[key] || []).filter(x => x.id !== taskId);
      saveDatabase();
      renderApp();
      showToast('Task removed');
    }

    function promptAddTask(category) {
      openQuickAddModal(category);
    }

    // Lecture Mutations
    function toggleLectureItem(lecId) {
      const log = getOrInitLog(state.currentDate);
      const l = (log.lectures || []).find(x => x.id === lecId);
      if (l) {
        l.attended = !l.attended;
        saveDatabase();
        renderApp();
      }
    }

    function updateLectureItem(lecId, field, val) {
      const log = getOrInitLog(state.currentDate);
      const l = (log.lectures || []).find(x => x.id === lecId);
      if (l) {
        l[field] = val;
        saveDatabase();
      }
    }

    function deleteLectureItem(lecId) {
      const log = getOrInitLog(state.currentDate);
      log.lectures = (log.lectures || []).filter(x => x.id !== lecId);
      saveDatabase();
      renderApp();
      showToast('Lecture removed');
    }

    function promptAddLecture() {
      openQuickAddModal('lecture');
    }

    // Vitals Mutations
    function toggleWorkout() {
      const log = getOrInitLog(state.currentDate);
      log.workout_completed = !log.workout_completed;
      saveDatabase();
      renderApp();
    }

    function adjustDsa(delta) {
      const log = getOrInitLog(state.currentDate);
      log.dsa_solved = Math.max(0, (log.dsa_solved || 0) + delta);
      saveDatabase();
      renderApp();
    }

    function adjustStudyHours(delta) {
      const log = getOrInitLog(state.currentDate);
      log.study_hours = Math.max(0, (log.study_hours || 0) + delta);
      saveDatabase();
      renderApp();
    }

    function adjustStartupHours(delta) {
      const log = getOrInitLog(state.currentDate);
      log.startup_hours = Math.max(0, (log.startup_hours || 0) + delta);
      saveDatabase();
      renderApp();
    }

    function adjustWater(delta) {
      const log = getOrInitLog(state.currentDate);
      log.water_liters = Math.max(0, Number(((log.water_liters || 0) + delta).toFixed(2)));
      saveDatabase();
      renderApp();
    }

    function setMood(m) {
      const log = getOrInitLog(state.currentDate);
      log.mood = m;
      saveDatabase();
      renderApp();
    }

    function updateDailyHighlight(val) {
      const log = getOrInitLog(state.currentDate);
      log.daily_highlight = val;
      saveDatabase();
    }

    // Settings Mutations
    function updateSetting(key, val) {
      state.db.settings[key] = val;
      saveDatabase();
      renderApp();
      showToast('Settings saved');
    }

    function removeLectureSubject(sub) {
      state.db.settings.lectureSubjects = (state.db.settings.lectureSubjects || []).filter(s => s !== sub);
      saveDatabase();
      renderApp();
    }

    function addLectureSubject() {
      const input = document.getElementById('new-subject-input');
      if (!input || !input.value.trim()) return;
      const sub = input.value.trim();
      if (!state.db.settings.lectureSubjects) state.db.settings.lectureSubjects = [];
      if (!state.db.settings.lectureSubjects.includes(sub)) {
        state.db.settings.lectureSubjects.push(sub);
        saveDatabase();
        renderApp();
        showToast(`Added subject: ${sub}`);
      }
    }

    function confirmResetSampleData() {
      if (confirm('Reset to initial 30-day sample data? Current changes will be overwritten.')) {
        state.db = generateSeedDatabase();
        saveDatabase();
        renderApp();
        showToast('Database reset to 30-day sample dataset');
      }
    }

    function confirmWipeAll() {
      if (confirm('Are you sure you want to completely erase the tracker database? This cannot be undone.')) {
        state.db = {
          version: 1,
          exportedAt: new Date().toISOString(),
          settings: generateSeedDatabase().settings,
          dailyLogs: {},
        };
        saveDatabase();
        renderApp();
        showToast('Database wiped.');
      }
    }

    function triggerImportJSON() {
      const input = document.getElementById('file-import-input');
      if (input) input.click();
    }

    // =========================================================================
    // QUICK ADD MODAL LOGIC
    // =========================================================================
    function openQuickAddModal(type = 'academic') {
      state.qaType = type;
      updateQuickAddTabs();
      const modal = document.getElementById('quick-add-modal');
      if (modal) {
        modal.classList.remove('hidden');
        const titleInput = document.getElementById('qa-input-title');
        if (titleInput) {
          titleInput.value = '';
          titleInput.focus();
        }
      }
    }

    function closeQuickAddModal() {
      const modal = document.getElementById('quick-add-modal');
      if (modal) modal.classList.add('hidden');
    }

    function updateQuickAddTabs() {
      const btnAcad = document.getElementById('qa-tab-academic');
      const btnStart = document.getElementById('qa-tab-startup');
      const btnLec = document.getElementById('qa-tab-lecture');
      const taskExtras = document.getElementById('qa-task-extras');
      const lectureExtras = document.getElementById('qa-lecture-extras');

      [btnAcad, btnStart, btnLec].forEach(b => {
        b.className = 'qa-type-btn py-2 px-2.5 rounded-xl border bg-zinc-950 border-zinc-800 text-zinc-400 hover:text-zinc-200 flex items-center justify-center gap-1.5';
      });

      if (state.qaType === 'academic') {
        btnAcad.className = 'qa-type-btn py-2 px-2.5 rounded-xl border bg-emerald-500/15 border-emerald-500/40 text-emerald-300 flex items-center justify-center gap-1.5';
        taskExtras.classList.remove('hidden');
        lectureExtras.classList.add('hidden');
      } else if (state.qaType === 'startup') {
        btnStart.className = 'qa-type-btn py-2 px-2.5 rounded-xl border bg-violet-500/15 border-violet-500/40 text-violet-300 flex items-center justify-center gap-1.5';
        taskExtras.classList.remove('hidden');
        lectureExtras.classList.add('hidden');
      } else {
        btnLec.className = 'qa-type-btn py-2 px-2.5 rounded-xl border bg-emerald-500/15 border-emerald-500/40 text-emerald-300 flex items-center justify-center gap-1.5';
        taskExtras.classList.add('hidden');
        lectureExtras.classList.remove('hidden');
      }
    }

    // =========================================================================
    // ESCAPE HTML HELPER
    // =========================================================================
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // =========================================================================
    // MAIN APP RENDER LOOP
    // =========================================================================
    function renderApp() {
      // 1. Sync Date input value
      const datePicker = document.getElementById('date-picker-input');
      if (datePicker && datePicker.value !== state.currentDate) {
        datePicker.value = state.currentDate;
      }

      // 2. Sync Desktop Navigation Tabs
      document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        const navTarget = btn.getAttribute('data-nav');
        if (navTarget === state.activeScreen) {
          btn.className = 'nav-tab-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-800 text-zinc-100 shadow border border-zinc-700/60 font-bold';
        } else {
          btn.className = 'nav-tab-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-zinc-400 hover:text-zinc-100 transition';
        }
      });

      // 3. Sync Mobile Bottom Navigation Tabs
      document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
        const navTarget = btn.getAttribute('data-nav');
        if (navTarget === state.activeScreen) {
          btn.className = 'mobile-nav-btn flex flex-col items-center gap-1 py-1 px-3 rounded-xl text-emerald-400 font-bold';
        } else {
          btn.className = 'mobile-nav-btn flex flex-col items-center gap-1 py-1 px-3 rounded-xl text-zinc-400 hover:text-zinc-200 transition';
        }
      });

      // 4. Render Active Viewport Content
      const viewport = document.getElementById('app-viewport');
      if (!viewport) return;

      if (state.activeScreen === 'today') {
        viewport.innerHTML = renderTodayView();
      } else if (state.activeScreen === 'weekly') {
        viewport.innerHTML = renderWeeklyView();
      } else if (state.activeScreen === 'monthly') {
        viewport.innerHTML = renderMonthlyView();
      } else if (state.activeScreen === 'settings') {
        viewport.innerHTML = renderSettingsView();
      }

      // 5. Initialize Lucide Icons for dynamic content
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // =========================================================================
    // INITIALIZATION & EVENT LISTENERS
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      // Load or initialize DB
      state.db = loadDatabase();

      // Top Navigation Button Listeners
      document.getElementById('btn-prev-day')?.addEventListener('click', () => shiftDay(-1));
      document.getElementById('btn-next-day')?.addEventListener('click', () => shiftDay(1));
      document.getElementById('btn-today')?.addEventListener('click', () => setDate(getTodayISO()));

      // Date Picker Change Listener
      document.getElementById('date-picker-input')?.addEventListener('change', (e) => {
        if (e.target.value) setDate(e.target.value);
      });

      // Desktop Nav Tabs
      document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const navTarget = btn.getAttribute('data-nav');
          if (navTarget) setScreen(navTarget);
        });
      });

      // Mobile Nav Tabs
      document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const navTarget = btn.getAttribute('data-nav');
          if (navTarget) setScreen(navTarget);
        });
      });

      // Quick Add Modal Buttons
      document.getElementById('btn-open-quick-add')?.addEventListener('click', () => openQuickAddModal());
      document.getElementById('btn-close-quick-add')?.addEventListener('click', closeQuickAddModal);
      document.getElementById('btn-cancel-quick-add')?.addEventListener('click', closeQuickAddModal);

      // Quick Add Category Switchers
      document.getElementById('qa-tab-academic')?.addEventListener('click', () => {
        state.qaType = 'academic';
        updateQuickAddTabs();
      });
      document.getElementById('qa-tab-startup')?.addEventListener('click', () => {
        state.qaType = 'startup';
        updateQuickAddTabs();
      });
      document.getElementById('qa-tab-lecture')?.addEventListener('click', () => {
        state.qaType = 'lecture';
        updateQuickAddTabs();
      });

      // Quick Add Form Submit
      document.getElementById('quick-add-form')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const title = document.getElementById('qa-input-title').value.trim();
        if (!title) return;

        const log = getOrInitLog(state.currentDate);

        if (state.qaType === 'academic' || state.qaType === 'startup') {
          const priority = document.getElementById('qa-select-priority').value;
          const timeEstimate = document.getElementById('qa-input-estimate').value.trim() || '30m';
          const key = state.qaType === 'academic' ? 'academic_tasks' : 'startup_tasks';

          if (!log[key]) log[key] = [];
          log[key].push({
            id: generateId(`task-${state.qaType}`),
            title,
            completed: false,
            category: state.qaType,
            priority,
            timeEstimate,
          });

          showToast(`Added ${state.qaType} task: ${title}`);
        } else {
          // Lecture
          const timeSlot = document.getElementById('qa-input-slot').value.trim() || 'Standard Slot';
          const topic = document.getElementById('qa-input-topic').value.trim() || '';

          if (!log.lectures) log.lectures = [];
          log.lectures.push({
            id: generateId('lec'),
            lecture_number: log.lectures.length + 1,
            subject_name: title,
            attended: false,
            topic,
            notes: '',
            time_slot: timeSlot,
          });

          showToast(`Added lecture: ${title}`);
        }

        saveDatabase();
        closeQuickAddModal();
        renderApp();
      });

      // File Import Listener
      document.getElementById('file-import-input')?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (file) {
          handleImportFile(file);
          e.target.value = ''; // Reset input
        }
      });

      // Keyboard Shortcut: ESC closes modal, 'n' opens quick add
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeQuickAddModal();
        } else if ((e.key === 'n' || e.key === 'N') && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
          openQuickAddModal();
        }
      });

      // Initial Render
      renderApp();
    });
  </script>
</body>

</html>
